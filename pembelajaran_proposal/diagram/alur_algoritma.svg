<svg width="720" height="1000" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="720" height="1000" fill="#f8fafc"/>

  <!-- Title -->
  <text x="360" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">Alur Algoritma Usulan</text>
  <text x="360" y="62" text-anchor="middle" font-size="13" fill="#475569">Histeresis Asimetris Sekuensial Sadar Biaya Keputusan</text>

  <!-- Box helper: rounded rect -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
    <style>
      .box { fill:#ffffff; stroke:#1e293b; stroke-width:1.5; }
      .proc { fill:#e0f2fe; stroke:#0284c7; }
      .dec { fill:#fef3c7; stroke:#d97706; }
      .act { fill:#dcfce7; stroke:#16a34a; }
      .txt { fill:#0f172a; font-size:14px; }
      .sm { fill:#334155; font-size:12px; }
    </style>
  </defs>

  <!-- Step 1 -->
  <rect x="180" y="90" width="360" height="54" rx="10" class="box proc"/>
  <text x="360" y="112" text-anchor="middle" class="txt" font-weight="bold">1. Probe aktif</text>
  <text x="360" y="131" text-anchor="middle" class="sm">kirim probe ke M target per jalur (RTT & loss)</text>

  <line x1="360" y1="144" x2="360" y2="170" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <rect x="180" y="172" width="360" height="54" rx="10" class="box proc"/>
  <text x="360" y="194" text-anchor="middle" class="txt" font-weight="bold">2. Pola pengamatan</text>
  <text x="360" y="213" text-anchor="middle" class="sm">00 · 10 · 01 · 11 (M target)</text>

  <line x1="360" y1="226" x2="360" y2="252" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <rect x="180" y="254" width="360" height="54" rx="10" class="box proc"/>
  <text x="360" y="276" text-anchor="middle" class="txt" font-weight="bold">3. Hitung LLR</text>
  <text x="360" y="295" text-anchor="middle" class="sm">ℓ(11) besar (degradasi) vs ℓ(lainnya) negatif</text>

  <line x1="360" y1="308" x2="360" y2="334" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <rect x="180" y="336" width="360" height="54" rx="10" class="box proc"/>
  <text x="360" y="358" text-anchor="middle" class="txt" font-weight="bold">4. Akumulasi CUSUM dua arah</text>
  <text x="360" y="377" text-anchor="middle" class="sm">S↓(degradasi) &amp; S↑(pemulihan) = max(0, S + LLR)</text>

  <line x1="360" y1="390" x2="360" y2="416" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decision step 5 -->
  <polygon points="360,418 560,466 360,514 160,466" class="dec"/>
  <text x="360" y="461" text-anchor="middle" class="txt" font-weight="bold">5. S &gt; ambang?</text>
  <text x="360" y="480" text-anchor="middle" class="sm">(h↓ / h↑)</text>

  <!-- No branch -->
  <line x1="160" y1="466" x2="60" y2="466" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="100" y="455" text-anchor="middle" class="sm" fill="#64748b">Tidak</text>
  <text x="55" y="492" text-anchor="start" class="sm" fill="#64748b">pertahankan status</text>
  <line x1="60" y1="466" x2="60" y2="80" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="60" y1="80" x2="180" y2="80" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="180" y1="80" x2="180" y2="90" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="70" y="72" text-anchor="start" class="sm" fill="#64748b">loop probe berikutnya</text>

  <!-- Yes branch -->
  <line x1="560" y1="466" x2="660" y2="466" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="610" y="455" text-anchor="middle" class="sm" fill="#16a34a">Ya → transisi status</text>
  <line x1="660" y1="466" x2="660" y2="586" stroke="#16a34a" stroke-width="2"/>
  <line x1="660" y1="586" x2="540" y2="586" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 6 -->
  <rect x="180" y="560" width="360" height="54" rx="10" class="box act"/>
  <text x="360" y="582" text-anchor="middle" class="txt" font-weight="bold">6. Peta aksi SRLG-aware</text>
  <text x="360" y="601" text-anchor="middle" class="sm">status ketiga jalur → bobot target (dievakuasi → FO)</text>

  <line x1="360" y1="614" x2="360" y2="640" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 7 -->
  <rect x="180" y="642" width="360" height="54" rx="10" class="box act"/>
  <text x="360" y="664" text-anchor="middle" class="txt" font-weight="bold">7. Kuantisasi ke N kelompok hash</text>
  <text x="360" y="683" text-anchor="middle" class="sm">bobot → jumlah kelompok bulat, minimal-remap</text>

  <line x1="360" y1="696" x2="360" y2="722" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 8 -->
  <rect x="180" y="724" width="360" height="54" rx="10" class="box act"/>
  <text x="360" y="746" text-anchor="middle" class="txt" font-weight="bold">8. Tulis ke aktuator (PCC)</text>
  <text x="360" y="765" text-anchor="middle" class="sm">perbarui pemetaan kelompok → hanya koneksi baru terdampak</text>

  <!-- Footer -->
  <text x="360" y="830" text-anchor="middle" class="sm" fill="#64748b">Skala waktu: langkah 1–5 tiap siklus (loop cepat); estimasi biaya/ambang pada loop lambat</text>
  <text x="360" y="880" text-anchor="middle" font-size="12" fill="#94a3b8">Lihat: 05_ALGORITMA_DIKEMBANGKAN.md · proposal subbab 2.5</text>
</svg>
